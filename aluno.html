<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz – Aluno</title><style>:root{--bg:#0A1325;--s:#121F38;--s2:#1A2B4C;--line:#2A3C61;--fg:#E8EEFB;--mut:#9DB0D3;--acc:#2E6BFF;--ok:#1FA971;--bad:#E5484D}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,sans-serif;padding:14px}
.wrap{max-width:480px;margin:0 auto}.card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{background:var(--s2);color:var(--acc);padding:4px 10px;border-radius:20px;font:700 12px monospace}.mut{color:var(--mut);font-size:13px}
.timer{font:700 42px monospace;color:var(--acc);text-align:center;background:var(--bg);padding:10px;border-radius:12px;border:1px solid var(--line);margin:10px 0}.timer.low{color:var(--bad)}
.q{background:var(--s2);padding:12px;border-radius:10px;font-size:17px;font-weight:700;margin:12px 0;border-left:4px solid var(--acc)}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;font:700 17px system-ui;padding:14px;border-radius:12px;margin-top:8px;cursor:pointer}
.btn:disabled{opacity:.4}.btn.danger{background:var(--bad)}.btn.ghost{background:var(--s2);color:var(--fg)}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--s2);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;font:16px system-ui}
.opt b{font-family:monospace;color:var(--acc)}.opt.sel{border-color:var(--acc)}.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.ok b,.opt.no b{color:#fff}.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
ul{list-style:none;padding:0;margin:10px 0 0}li{background:var(--s2);padding:10px 12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
li.me{outline:2px solid var(--acc)}.rk{font:700 14px monospace;color:var(--acc);margin-right:8px}
input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin-top:8px}
h3{margin:0 0 6px;font-size:18px}.warn{color:var(--bad);font-size:14px;margin-top:8px}.big{font:700 22px monospace;text-align:center;color:var(--acc);margin:6px 0}</style></head>
<body><div class="wrap" id="app"><div class="card">Carregando…</div></div>
<script>
const DB="https://quiz-matematica-63f6f-default-rtdb.firebaseio.com";
const Q=[{"q": "Grandezas derivadas são obtidas de que forma?", "o": ["Combinando grandezas fundamentais", "Medindo direto com uma régua", "Apenas somando grandezas", "Escolhendo qualquer valor"], "c": 0}, {"q": "Quantas grandezas fundamentais o SI tem?", "o": ["5", "6", "7", "8"], "c": 2}, {"q": "Qual é a unidade da velocidade no SI?", "o": ["m/s²", "m/s", "km", "N"], "c": 1}, {"q": "Um carro percorre 100 m em 20 s. Qual a velocidade?", "o": ["2 m/s", "5 m/s", "20 m/s", "0,2 m/s"], "c": 1}, {"q": "Qual fórmula define a força?", "o": ["F = m / a", "F = m · a", "F = m + a", "F = a / m"], "c": 1}, {"q": "Um objeto de 2 kg recebe aceleração de 3 m/s². Qual a força?", "o": ["1,5 N", "5 N", "6 N", "12 N"], "c": 2}, {"q": "O newton (N) equivale a qual combinação de unidades de base?", "o": ["kg·m/s", "kg·m²/s²", "kg·m/s²", "kg/(m·s)"], "c": 2}, {"q": "Uma força de 10 N desloca um objeto por 5 m. Qual a energia (trabalho)?", "o": ["2 J", "15 J", "50 J", "5 J"], "c": 2}, {"q": "Um motor realiza 100 J de energia em 4 s. Qual a potência?", "o": ["25 W", "400 W", "96 W", "4 W"], "c": 0}, {"q": "Uma força de 100 N atua sobre uma área de 2 m². Qual a pressão?", "o": ["200 Pa", "50 Pa", "102 Pa", "0,02 Pa"], "c": 1}, {"q": "Qual é a unidade da aceleração?", "o": ["m/s", "m/s²", "m²", "N"], "c": 1}, {"q": "Um bloco tem massa de 10 kg e volume de 2 m³. Qual a densidade?", "o": ["20 kg/m³", "12 kg/m³", "0,2 kg/m³", "5 kg/m³"], "c": 3}, {"q": "Uma caixa mede 2 m × 3 m × 4 m. Qual o volume?", "o": ["9 m³", "12 m³", "24 m³", "14 m³"], "c": 2}, {"q": "Um piso mede 5 m por 4 m. Qual a área?", "o": ["9 m²", "18 m²", "20 m²", "40 m²"], "c": 2}, {"q": "Um pêndulo tem período T = 0,5 s. Qual a frequência?", "o": ["0,5 Hz", "2 Hz", "5 Hz", "0,2 Hz"], "c": 1}, {"q": "Qual destas unidades NÃO é derivada?", "o": ["Newton", "Metro", "Joule", "Pascal"], "c": 1}, {"q": "O consumo de energia elétrica em kWh é uma medida de qual grandeza?", "o": ["Potência", "Tempo", "Energia", "Força"], "c": 2}];
const N=Q.length,TIME=30,L="ABCD";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let state={status:"LOBBY",q:-1,startedAt:0},groups=[],answers=[],last="",offline=false;
async function api(p,m,b){const r=await fetch(DB+"/"+p+".json",{method:m||"GET",body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);return r.json()}
const rem=()=>Math.max(0,TIME-(Date.now()-state.startedAt)/1000);
const msize=g=>Object.keys(g.members||{}).length;
const sorted=()=>groups.slice().sort((a,b)=>(b.score||0)-(a.score||0)||a.name.localeCompare(b.name));
const ansOf=(gid,q)=>answers.find(a=>a.id===q+"_"+gid);
async function poll(){
  try{
    const d=(await api(""))||{};offline=false;
    const s=JSON.stringify(d);
    if(s!==last){last=s;
      state=d.state||{status:"LOBBY",q:-1,startedAt:0};
      groups=Object.entries(d.groups||{}).map(([id,v])=>({id,...v}));
      answers=Object.entries(d.answers||{}).map(([id,v])=>({id,...v}));
      render();}
  }catch(e){offline=true;if(!last)$("app").innerHTML='<div class="card"><h3>Sem conexão</h3><p class="mut">Não consegui falar com o banco de dados. Confira a internet e o endereço do Firebase.</p></div>'}
}
function tick(){
  const t=$("timer");if(!t)return;const r=Math.ceil(rem());
  if(state.status==="PLAYING"){t.textContent=r+"s";t.classList.toggle("low",r<=5);if(window.onZero&&r<=0)window.onZero()}
  else{t.textContent=state.status==="REVEAL"?"0s":TIME+"s";t.classList.remove("low")}
}
function opts(q,pick,showOk,click){
  return Q[q].o.map((t,i)=>{let c="opt";if(showOk&&i===Q[q].c)c+=" ok";else if(showOk&&pick===i)c+=" no";else if(pick===i)c+=" sel";
  const tag=click?"button":"div";return `<${tag} class="${c}" ${click?`onclick="answer(${i})"`:""}><b>${L[i]}</b><span>${esc(t)}</span></${tag}>`}).join("");
}
function board(meId){
  const s=sorted();if(!s.length)return '<li class="mut" style="justify-content:center">Nenhum grupo entrou ainda</li>';
  return s.map((g,i)=>`<li class="${g.id===meId?"me":""}"><span><span class="rk">#${i+1}</span><b>${esc(g.name)}</b> <span class="mut">(${msize(g)}/6)</span></span><b>${g.score||0} pts</b></li>`).join("");
}
setInterval(poll,1000);setInterval(tick,250);poll();

let me=localStorage.getItem("quiz_uid");if(!me){me="u"+Math.random().toString(36).slice(2,10);localStorage.setItem("quiz_uid",me)}
let draft={name:localStorage.getItem("quiz_nome")||"",grp:""};
const myGroup=()=>groups.find(g=>(g.members||{})[me]);
async function createGroup(){const n=draft.name.trim(),g=draft.grp.trim();if(!n||!g)return alert("Digite seu nome e o nome do grupo.");
  localStorage.setItem("quiz_nome",n);await api("groups","POST",{name:g,score:0,members:{[me]:{n}}});last="";poll()}
async function joinGroup(id){const n=draft.name.trim();if(!n)return alert("Digite seu nome primeiro.");
  const g=groups.find(x=>x.id===id);if(!g||msize(g)>=6)return alert("Grupo cheio.");
  localStorage.setItem("quiz_nome",n);await api("groups/"+id+"/members/"+me,"PUT",{n});last="";poll()}
async function answer(ch){const g=myGroup();if(!g||state.status!=="PLAYING"||rem()<=0||ansOf(g.id,state.q))return;
  await api("answers/"+state.q+"_"+g.id,"PUT",{q:state.q,g:g.id,ch,rem:Math.round(rem()),by:me});last="";poll()}
function render(){
  const st=state.status,q=state.q,g=myGroup(),pos=g?sorted().findIndex(x=>x.id===g.id)+1:0;let main;
  if(!g){
    if(st!=="LOBBY")main='<div class="q">A partida já começou. Aguarde a próxima rodada para entrar em um grupo.</div>';
    else main=`<h3>Entrar na partida</h3><input placeholder="Seu nome" value="${esc(draft.name)}" oninput="draft.name=this.value">
    <input placeholder="Nome de um novo grupo" value="${esc(draft.grp)}" oninput="draft.grp=this.value">
    <button class="btn" onclick="createGroup()">Criar grupo</button>
    <div class="mut" style="margin-top:14px">Ou entre em um grupo existente (2 a 6 pessoas):</div>
    <ul>${groups.map(x=>`<li><span><b>${esc(x.name)}</b> <span class="mut">(${msize(x)}/6)</span></span><button class="btn" style="width:auto;margin:0;padding:8px 14px;font-size:15px" ${msize(x)>=6?"disabled":""} onclick="joinGroup('${x.id}')">Entrar</button></li>`).join("")||'<li class="mut">Nenhum grupo ainda</li>'}</ul>`}
  else if(st==="LOBBY"){main=`<div class="big">${esc(g.name)}</div><div class="mut" style="text-align:center">${Object.values(g.members).map(m=>esc(m.n)).join(", ")}</div>
    <div class="q">${msize(g)<2?"Falta pelo menos mais 1 pessoa no grupo.":"Aguardando o professor iniciar…"}</div>`}
  else if(st==="FINISHED"){main=`<div class="q">Fim de jogo! Seu grupo ficou em ${pos}º lugar com ${g.score||0} pts.</div>`}
  else{const a=ansOf(g.id,q),rv=st==="REVEAL";
    main=`<div class="q">${q+1}. ${esc(Q[q].q)}</div>${opts(q,a?a.ch:-1,rv,st==="PLAYING"&&!a)}
    <div class="mut" style="margin-top:10px">${rv?(a&&a.ch===Q[q].c?"Seu grupo acertou! 🎉":a?"Seu grupo errou.":"Seu grupo não respondeu."):a?"Resposta enviada. Aguarde o tempo acabar.":"Escolha uma alternativa."}</div>`}
  $("app").innerHTML=`<div class="card"><div class="row"><span class="badge">ALUNO</span><span class="mut">${st==="LOBBY"?0:Math.min(q+1,N)}/${N}</span></div>
  <div class="timer" id="timer">${TIME}s</div>${main}</div>
  ${g?`<div class="card"><div class="row"><h3>Seu grupo</h3><span class="badge">${pos}º lugar</span></div><div class="big">${g.score||0} pts</div></div>`:""}
  <div class="card"><h3>Placar dos Grupos</h3><ul>${board(g?g.id:"")}</ul></div>`;
  tick();
}
</script></body></html>
